<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание ЭБ-5-23</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхняя навигация -->
    <div class="header-nav">
        <div class="week-nav">
            <button id="prevWeek" class="arrow-btn">‹</button>
            <h1 class="current-week-title" id="weekTitle">Текущая неделя</h1>
            <button id="nextWeek" class="arrow-btn">›</button>
        </div>
        <div class="group-select-wrapper">
            <select id="groupSelect" class="group-select">
                <option value="all">Все группы</option>
                <option value="ЭБ-5-23-01">ЭБ-5-23-01</option>
                <option value="ЭБ-5-23-02">ЭБ-5-23-02</option>
            </select>
        </div>
        <button id="todayBtn" class="today-week-btn">↻ Текущая неделя</button>
    </div>

    <main>
        <div id="scheduleView">
            <div id="scheduleList" class="schedule-list"></div>
        </div>
    </main>

    <footer id="changelogFooter" class="hidden">
        <div class="changelog-content">
            <strong>🔄 Обновлено:</strong> <span id="updateDate"></span>
            <ul id="updateChanges"></ul>
        </div>
    </footer>

    <!-- Круглые кнопки внизу -->
    <div class="bottom-nav">
        <button id="scheduleBtn" class="nav-btn active">
            <span class="nav-icon">📅</span>
            <span class="nav-label">Расписание</span>
        </button>
        <button id="sessionBtn" class="nav-btn">
            <span class="nav-icon">🎓</span>
            <span class="nav-label">Сессия</span>
        </button>
        <button id="calendarBtn" class="nav-btn">
            <span class="nav-icon">📆</span>
            <span class="nav-label">Календарь</span>
        </button>
        <button id="updatesBtn" class="nav-btn">
            <span class="nav-icon">🔄</span>
            <span class="nav-label">Обновления</span>
        </button>
    </div>

    <!-- Кнопка Google Calendar внизу страницы -->
    <div class="google-calendar-section">
        <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Расписание+ЭБ-5-23&dates=20260101T080000/20260101T180000&details=Расписание+занятий+группы+ЭБ-5-23-01/02" target="_blank" class="gcal-link">
            <span class="gcal-icon">📅</span>
            <span class="gcal-text">Добавить в Google Календарь</span>
        </a>
    </div>

    <!-- Панель расписания -->
    <div id="schedulePanel" class="side-panel hidden">
        <div class="panel-header">
            <h3>📅 Расписание</h3>
            <button class="close-panel-btn" data-panel="schedulePanel">✕</button>
        </div>
        <div class="panel-content">
            <div id="schedulePanelList" class="schedule-list"></div>
        </div>
    </div>

    <!-- Панель сессии -->
    <div id="sessionPanel" class="side-panel hidden">
        <div class="panel-header">
            <h3>🎓 Сессия</h3>
            <button class="close-panel-btn" data-panel="sessionPanel">✕</button>
        </div>
        <div class="panel-content">
            <div class="panel-week-nav">
                <button id="prevSessionWeek" class="arrow-btn">‹</button>
                <span id="sessionWeekTitle" class="panel-week-title">Текущая неделя</span>
                <button id="nextSessionWeek" class="arrow-btn">›</button>
            </div>
            <div id="sessionPanelList" class="schedule-list"></div>
        </div>
    </div>

    <!-- Панель календаря -->
    <div id="calendarPanel" class="side-panel hidden">
        <div class="panel-header">
            <h3>📆 Календарь</h3>
            <button class="close-panel-btn" data-panel="calendarPanel">✕</button>
        </div>
        <div class="panel-content">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prevMonth" class="nav-arrow">‹</button>
                    <h2 id="calendarMonthTitle">Месяц</h2>
                    <button id="nextMonth" class="nav-arrow">›</button>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
            </div>
        </div>
    </div>

    <!-- Панель обновлений -->
    <div id="updatesPanel" class="side-panel hidden">
        <div class="panel-header">
            <h3>🔄 История обновлений</h3>
            <button class="close-panel-btn" data-panel="updatesPanel">✕</button>
        </div>
        <div class="panel-content">
            <div class="last-update">
                <strong>Последнее обновление:</strong>
                <span id="lastUpdateDate">—</span>
            </div>
            <div class="changes-list" id="changesList">
                <p style="color: #757575;">Нет данных об изменениях</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
