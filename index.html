<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание ЭБ-5-23</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 ЭБ-5-23-01/02</h1>
        <div class="controls">
            <button id="toggleMode" class="btn active">Расписание</button>
            <button id="calendarBtn" class="btn">Календарь</button>
        </div>
    </header>

    <main>
        <div id="scheduleView">
            <h2 id="currentWeekTitle">Текущая неделя</h2>
            <div id="scheduleList" class="schedule-list"></div>
        </div>

        <div id="calendarView" class="hidden">
            <h2 id="calendarMonthTitle">Месяц</h2>
            <div id="calendarGrid" class="calendar-grid"></div>
        </div>
    </main>

    <footer id="changelogFooter" class="hidden">
        <div class="changelog-content">
            <strong>🔄 Обновлено:</strong> <span id="updateDate"></span>
            <ul id="updateChanges"></ul>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
